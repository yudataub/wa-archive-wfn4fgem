<!DOCTYPE html>
<!-- wa-archive-generated v20 -->
<!--
  דף חיפוש אחד לכל הארכיונים. נכתב על ידי whatsapp-bridge/site-search.js —
  לא לערוך כאן במאגר (יידרס), לערוך ב-site-search.html ולהעלות SITE_PAGE_VERSION.
  קורא data/search.json: { groups:{slug:{name,hue,n}}, messages:[[slug,id,ts,date,time,sender,text,files]] }
-->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>חיפוש בכל הארכיון</title>
<style>
:root{--hue:214;
--bg:hsl(var(--hue) 28% 90%);--panel:hsl(var(--hue) 40% 98%);--bubble:#fff;--ink:#1f2421;
--muted:#6b7280;--accent:hsl(var(--hue) 42% 32%);--line:hsl(var(--hue) 18% 80%);--mark:#ffe680;}
@media (prefers-color-scheme:dark){:root{--bg:hsl(var(--hue) 16% 9%);--panel:hsl(var(--hue) 14% 14%);
--bubble:hsl(var(--hue) 12% 17%);--ink:#e8edf2;--muted:#94a3b8;--accent:hsl(var(--hue) 45% 62%);
--line:hsl(var(--hue) 10% 25%);--mark:#7a5c00;}}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.18);}
header h1{margin:0;font-size:18px;font-weight:600;}
header .sub{font-size:12px;opacity:.85;margin-top:2px;}
#q{width:100%;box-sizing:border-box;margin-top:10px;padding:10px;border:0;border-radius:8px;font-size:16px;font-family:inherit;}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
#g,#sortby{flex:1;min-width:150px;box-sizing:border-box;padding:8px 10px;border:0;border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:#1f2421;}
main{max-width:820px;margin:0 auto;padding:16px;}
.hit{background:var(--bubble);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;
box-shadow:0 1px 2px rgba(0,0,0,.05);display:block;text-decoration:none;color:inherit;}
.hit:hover{border-color:var(--accent);}
.hit .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:4px;}
.chip{background:hsl(var(--gh) 40% 90%);color:hsl(var(--gh) 45% 25%);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;}
@media (prefers-color-scheme:dark){.chip{background:hsl(var(--gh) 25% 22%);color:hsl(var(--gh) 50% 75%);}}
.hit .who{font-weight:600;color:var(--ink);font-size:13px;}
.hit .txt{white-space:pre-wrap;word-wrap:break-word;line-height:1.5;font-size:14px;}
.hit .files{color:var(--muted);font-size:12px;margin-top:4px;}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px;}
#status{text-align:center;color:var(--muted);padding:24px 16px;font-size:14px;line-height:1.6;}
#more{display:block;width:100%;margin:14px 0 30px;padding:12px;font-size:15px;font-family:inherit;
background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;cursor:pointer;}
#more[hidden]{display:none;}
</style>
</head>
<body>
<header>
<h1>חיפוש בכל הארכיון</h1>
<div class="sub" id="sub">טוען…</div>
<input id="q" type="search" placeholder="מה לחפש? (אפשר כמה מילים)" autocomplete="off">
<div class="row">
 <select id="g" aria-label="סינון לפי קבוצה"><option value="">כל הקבוצות</option></select>
 <select id="sortby" aria-label="סדר"><option value="new">החדשות קודם</option><option value="old">הישנות קודם</option></select>
</div>
</header>
<main><div id="hits"></div><button id="more" hidden>עוד תוצאות</button><div id="status">טוען את האינדקס…</div></main>
<script>
var DATA={groups:{},messages:[]},shown=0,PAGE=100,last=[];
var q=document.getElementById("q"),gSel=document.getElementById("g"),sortSel=document.getElementById("sortby");
var hits=document.getElementById("hits"),more=document.getElementById("more");
var statusEl=document.getElementById("status"),sub=document.getElementById("sub");
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
 return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
// מילות החיפוש — AND: הודעה צריכה להכיל את כולן (בטקסט, בשולח, בשם הקבוצה או בשם קובץ)
function terms(){return q.value.toLowerCase().split(/\s+/).filter(function(t){return t.length>0;});}
function haystack(m){return (m[5]+" "+m[6]+" "+m[7]+" "+((DATA.groups[m[0]]||{}).name||"")).toLowerCase();}
function match(m,ts){var h=haystack(m);for(var i=0;i<ts.length;i++)if(h.indexOf(ts[i])<0)return false;return true;}
// הדגשה: עוטפים כל מופע של כל מילה. מחפשים על המחרוזת שכבר עברה esc, אז אין הזרקה.
function mark(text,ts){
 var out=esc(text);
 ts.forEach(function(t){
  var safe=esc(t).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  if(safe)out=out.replace(new RegExp("("+safe+")","gi"),"<mark>$1</mark>");});
 return out;}
// קטע סביב ההתאמה הראשונה — הודעה ארוכה לא תשתלט על המסך
function snippet(text,ts){
 var low=text.toLowerCase(),at=-1;
 for(var i=0;i<ts.length;i++){var k=low.indexOf(ts[i]);if(k>-1&&(at<0||k<at))at=k;}
 if(text.length<=280||at<0)return {s:text.slice(0,280),cut:text.length>280};
 var from=Math.max(0,at-90);
 return {s:(from?"…":"")+text.slice(from,from+280),cut:from+280<text.length};}
function results(){
 var ts=terms(),g=gSel.value;
 var list=DATA.messages;
 if(g)list=list.filter(function(m){return m[0]===g;});
 if(ts.length)list=list.filter(function(m){return match(m,ts);});
 if(sortSel.value==="old")list=list.slice().reverse();
 return list;}
function render(reset){
 var ts=terms();
 if(reset){shown=0;hits.innerHTML="";last=results();}
 var slice=last.slice(shown,shown+PAGE),html="";
 slice.forEach(function(m){
  var g=DATA.groups[m[0]]||{name:m[0],hue:210};
  var sn=snippet(m[6]||"",ts);
  html+='<a class="hit" style="--gh:'+(g.hue||210)+'" href="../g/'+encodeURIComponent(m[0])+'/#m-'+encodeURIComponent(m[1])+'">'+
   '<div class="top"><span class="chip">'+esc(g.name)+'</span><span class="who">'+mark(m[5]||"",ts)+'</span>'+
   '<span>'+esc(m[3])+" "+esc(m[4])+'</span></div>'+
   (sn.s?'<div class="txt">'+mark(sn.s,ts)+(sn.cut?"…":"")+'</div>':"")+
   (m[7]?'<div class="files">📎 '+mark(m[7].split("|").join(", "),ts)+'</div>':"")+
   '</a>';});
 hits.insertAdjacentHTML("beforeend",html);
 shown+=slice.length;
 more.hidden=shown>=last.length;
 more.textContent="עוד תוצאות ("+(last.length-shown)+")";
 statusEl.textContent=last.length?"":(terms().length?"לא נמצאו תוצאות.":"");
 sub.textContent=(terms().length||gSel.value?last.length+" תוצאות · ":"")+
  DATA.messages.length+" הודעות ב-"+Object.keys(DATA.groups).length+" קבוצות";}
function buildGroups(){
 var names=Object.keys(DATA.groups).sort(function(a,b){
  return DATA.groups[b].n-DATA.groups[a].n||DATA.groups[a].name.localeCompare(DATA.groups[b].name,"he");});
 var html='<option value="">כל הקבוצות ('+names.length+')</option>';
 names.forEach(function(s){html+='<option value="'+esc(s)+'">'+esc(DATA.groups[s].name)+" ("+DATA.groups[s].n+")</option>";});
 gSel.innerHTML=html;}
var timer=null;
q.addEventListener("input",function(){clearTimeout(timer);timer=setTimeout(function(){render(true);},150);});
gSel.addEventListener("change",function(){render(true);});
sortSel.addEventListener("change",function(){render(true);});
more.addEventListener("click",function(){render(false);});
// האינדקס מפוצל לחודשים (כמו הארכיון) — חודש ישן לא משתנה לעולם, אז הדפדפן מטמין אותו.
// טוענים את כולם במקביל, מחדש לישן, ומרנדרים ברגע שהראשון הגיע כדי שהחיפוש יהיה זמין מיד.
fetch("data/index.json?t="+Date.now()).then(function(r){
 if(!r.ok)throw new Error("אין אינדקס");return r.json();})
 .then(function(d){
  DATA.groups=d.groups||{};
  var months=(d.months||[]).slice().sort().reverse();
  if(!months.length){statusEl.textContent="הארכיון ריק.";return;}
  buildGroups();q.focus();
  var done=0;
  return Promise.all(months.map(function(mo){
   return fetch("data/"+encodeURIComponent(mo)+".json").then(function(r){return r.ok?r.json():[];})
    .catch(function(){return [];})
    .then(function(rows){
     DATA.messages=DATA.messages.concat(rows);
     DATA.messages.sort(function(a,b){return b[2]-a[2];});
     done++;
     render(true);
     statusEl.textContent=done<months.length?("טוען… ("+done+" מתוך "+months.length+" חודשים)")
      :"הקלד מילה כדי לחפש בכל הקבוצות.";});}));})
 .catch(function(){statusEl.textContent="האינדקס עדיין לא נבנה. הוא נוצר בריצת site-push הבאה.";});
</script>
</body>
</html>
