<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ארכיון סוכות תשפ״ז</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7ec; --bg2:#f3ecd9; --card:#fffdf7; --ink:#2b2a22; --muted:#6f6a58; --line:#e6dcc2;
  --green:#3f6b3a; --green2:#5d8f4e; --gold:#c99a1b; --citron:#e8c547; --shadow:0 1px 2px rgba(60,50,20,.06),0 6px 20px rgba(60,50,20,.07);
  --chip:#efe6cf;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16180f; --bg2:#1d2014; --card:#23261a; --ink:#ece6d2; --muted:#a9a38b; --line:#383b2a;
    --green:#8fc27f; --green2:#a8d596; --gold:#e3bb4a; --citron:#e8c547; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --chip:#2e3122;
  }
}
:root[data-theme="dark"]{
  --bg:#16180f; --bg2:#1d2014; --card:#23261a; --ink:#ece6d2; --muted:#a9a38b; --line:#383b2a;
  --green:#8fc27f; --green2:#a8d596; --gold:#e3bb4a; --citron:#e8c547; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --chip:#2e3122;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Heebo,system-ui,sans-serif;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* ---- כותרת: סכך + קישוטים תלויים ---- */
.hero{position:relative;background:linear-gradient(180deg,var(--bg2),var(--bg));padding:0 0 34px;overflow:hidden}
.schach{height:30px;background:
  repeating-linear-gradient(100deg,transparent 0 9px,var(--green) 9px 12px,transparent 12px 22px),
  repeating-linear-gradient(80deg,transparent 0 13px,var(--green2) 13px 15px,transparent 15px 27px);
  opacity:.85;border-bottom:3px solid var(--gold)}
.hang{display:flex;justify-content:space-around;max-width:900px;margin:0 auto;height:74px;pointer-events:none}
.hang span{position:relative;display:block;font-size:26px;padding-top:var(--d);animation:sway 4s ease-in-out infinite;transform-origin:top center;animation-delay:var(--dl)}
.hang span::before{content:"";position:absolute;top:0;left:50%;width:1px;height:var(--d);background:var(--muted);opacity:.5}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.hang span{animation:none}}
.hero h1{font:900 clamp(34px,6vw,58px)/1.1 "Frank Ruhl Libre",serif;margin:6px 0 8px;text-align:center;color:var(--green)}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p.sub{text-align:center;color:var(--muted);margin:0 auto 20px;max-width:640px;font-size:18px}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 16px;box-shadow:var(--shadow);font-size:15px}
.stat b{color:var(--green);font-size:18px}
.theme{position:absolute;top:40px;left:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:38px;height:38px;cursor:pointer;font-size:17px}

/* ---- קטלוג נושאים ---- */
h2.sec{font:700 26px/1.2 "Frank Ruhl Libre",serif;margin:34px 0 14px;color:var(--ink)}
.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{--h:150;display:flex;gap:12px;align-items:flex-start;text-align:right;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:14px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,border-color .15s;color:var(--ink);font:inherit;width:100%}
.tile:hover{transform:translateY(-2px);border-color:hsl(var(--h) 45% 55%)}
.tile .ic{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:hsl(var(--h) 60% 50% / .14)}
.tile b{display:block;font-size:16px}
.tile small{display:block;color:var(--muted);font-size:13px;line-height:1.45}
.tile .n{margin-inline-start:auto;flex:none;background:hsl(var(--h) 55% 45%);color:#fff;border-radius:999px;font-size:13px;padding:1px 9px;font-weight:700}

/* ---- סרגל כלים דביק ---- */
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);margin-top:28px}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:10px;padding-bottom:10px}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 14px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;padding:9px 0;outline:none}
.chips{flex:1 1 100%;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--bg)}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.count{font-size:14px;color:var(--muted);margin-inline-start:auto;white-space:nowrap}

/* ---- נושא וכרטיסים ---- */
.topic{scroll-margin-top:120px}
.topic-h{--h:150;display:flex;align-items:center;gap:12px;margin:34px 0 14px;padding-bottom:10px;border-bottom:2px solid hsl(var(--h) 45% 50% / .35)}
.topic-h .ic{font-size:30px}
.topic-h h3{margin:0;font:700 24px/1.2 "Frank Ruhl Libre",serif}
.topic-h p{margin:0;color:var(--muted);font-size:14px}
.grid{columns:3 300px;column-gap:14px}
.bar .wrap>*{min-width:0}
.card{--h:150;break-inside:avoid;margin:0 0 14px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  overflow:hidden;border-top:4px solid hsl(var(--h) 50% 50%)}
.card .hd{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:12px 14px 0;font-size:13px;color:var(--muted)}
.card .grp{font-weight:700;color:hsl(var(--h) 45% 38%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card .grp{color:hsl(var(--h) 55% 70%)}}
:root[data-theme="dark"] .card .grp{color:hsl(var(--h) 55% 70%)}
.card .who{color:var(--ink);font-weight:500}
.card .tx{padding:8px 14px 0;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;font-size:15.5px}
.card .tx.clamp{display:-webkit-box;-webkit-line-clamp:9;-webkit-box-orient:vertical;overflow:hidden}
.card .tx a{color:var(--green);word-break:break-all}
.more{border:0;background:none;color:var(--green);font:inherit;font-size:14px;cursor:pointer;padding:2px 14px 0}
.thumb{display:block;margin:10px 14px 0;border-radius:10px;overflow:hidden;background:var(--bg2)}
.thumb img{display:block;width:100%;height:auto;max-height:340px;object-fit:cover}
.files{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px 0}
.file{display:inline-flex;align-items:center;gap:6px;max-width:100%;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:13.5px;text-decoration:none}
.file span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.file:hover{border-color:var(--green)}
.file.off{opacity:.6}
.also{padding:8px 14px 0;font-size:12.5px;color:var(--muted)}
.ft{display:flex;gap:6px;padding:12px 14px 12px}
.btn{flex:1;text-align:center;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:7px 8px;font:inherit;font-size:13.5px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--green);color:var(--green)}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:18px}
footer{color:var(--muted);text-align:center;font-size:13px;padding:40px 16px 60px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
mark{background:color-mix(in srgb,var(--citron) 55%,transparent);color:inherit;border-radius:3px}
@media (max-width:560px){.hero p.sub{font-size:16px}.hang span{font-size:20px}.count{width:100%;margin:0}}
@media print{.bar,.theme,.hang,.ft,.more{display:none}.card{box-shadow:none}.tx.clamp{-webkit-line-clamp:unset;display:block}}
</style>
</head>
<body>

  <div class="schach" aria-hidden="true"></div>

    <span style="--d:28px;--dl:.3s">🍎</span><span style="--d:16px;--dl:.9s">🌿</span><span style="--d:32px;--dl:1.5s">🍐</span>

ה'תפארת שלמה' מבאר את דברי חז\"ל: \"מצטער פטור מן הסוכה\" – בסגולת מצוות סוכה אפשר להיפטר מצערו ומצוקותיו, והיינו ש'מצטער פטור' מצרותיו של ידי מצוות 'סוכה'. באופן זהה מבואר 'חולין ומשמשיהן פטורין מן הסוכה' – שיהיו נפטרין מכל חולי ומכאוב, ויתרפאו רפואת הנפש ורפואת הגוף על ידי הסוכה.*\n\n*⚜️ה'שפת אמת' מפרש את נוסח הברכה בשמונה עשרה: \"מלך ממית ומחיה ומצמיח ישועה\" כך: 'מלך' – בראש השנה, 'ממית ומחיה' – ביום הכיפורים, בו הקדוש ברוך הוא יושב על כיסא מלכותו במשפט וחותך קצבת חיים לכל ברואיו, 'ומצמיח ישועה' – בחג הסוכות שאפשר לפעול ישועות ולבטל את הגזרות רעות, וכל המשפט בראש השנה היה להצמיח ישועה זו.*\n\n*יום טוב לכל ישראל!!!*🍋🌷🍏☘️🍋🌷🍏☘️🍋🌷🍏☘️🍋🌷🍏☘️🍋🌷🍏☘️🍋🌷🍏☘️🍋🌷🍏☘️🍋🌷🍏☘️","a":[],"f":[]},{"c":"torah","g":"נחל אליהו - שיעורי הגר\"א דיסקין","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/nchl-alyhv-shyavry-hgr-a-dyskyn-74f2jd/#m-ACCFA745EBD9C7D2EC91571DC49C9AA7","d":"2026-09-22","t":"22:59","s":"להגדיל תורה","x":"","a":[],"f":[{"n":"חג הסוכות - הרב אליהו דיסקין .pdf","y":"application/pdf","p":"https://drive.google.com/file/d/10OkD5Z2T_ZvOhPZzpFpn-HzWmNO-UAW3/view?usp=drivesdk","h":"","k":""}]},{"c":"torah","g":"🕎בית מדרש קהילתי ק.אתא✡️","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/byt-mdrsh-khylty-k-ata-v7gamj/#m-ACDCC5887E09A9986AA7FBD45DF4FC74","d":"2026-09-23","t":"09:52","s":"מי שמאמין לא מפחד","x":"*⚜️עוד במעלת מצוות הסוכה⚜️*\n\n*🤍\"לשם יחוד קודשא בריך הוא ושכינתיה\"*🤍\n\n*⚜️המקיים מצוות סוכה זוכה לאריכות ימים. ניתן לרמוז מהפסוק: \"כל האזרח בישראל ישבו בסוכות\", \"אזרח\" בגימטריה \"גבורה\", שהבטיח הקב\"ה שכל היושבים בסוכה יהיו אזרחים וזקנים, ולכן אזרח בגימטריה גבורות, שיגיע לגבורות, כמו שכתוב ''ואם בגבורות שמונים שנה''.*\n\n*⚜️ה'כף החיים' מביא בשם ה'יפה ללב': \"מאן דזהיר במצוות סוכה, ולעשותה כתיקונה, מובטח לו שלא יהיה מריבה בתוך ביתו כל אותה שנה', ובספר 'סגולת ישראל' מביא סגולה להינצל מחלוקת: \"ילמד מסכת סוכה בכל ימות השנה, כמו שנאמר: \"תצפנם בסוכה מריב לשונות\".*\n\n*⚜️ב\"ספר החינוך\" מובא שהאתרוג דומה ללב שהוא משכן השכל – לרמוז שיעבוד הבורא בשכלו, והלולב דומה לשדרה שהיא העיקר שבאדם, לרמוז שיישר כל גופו לעבודתו ב\"ה, וההדס דומה לעיניים לרמז שלא יתור אחר עיניו, והערבה דומה לשפתיים, שבהן יגמור האדם כל מעשהו בדיבור, לרמוז שישים רסן בפיו ויכוון דבריו, ויירא מה' אף בעת השמחה – כלומר על ידי נטילת ארבע מינים יזכור את המלחמה המוטלת עליו: להמליך את הבוקר עליו בכל ענייניו.*\n\n*חג שמח לכל ישראל!!*🌼🍏🍊🌸🍇🌼🍏🍊🌸🍇🌼🍏🍊🌸🍇🌼🍏🍊🌸🍇🌼🍏🍊🌸🍇🌼🍏🍊🌸🍇🌼🍏🍊🌸🍇🌼🍏🍊🌸🍇","a":[],"f":[]},{"c":"torah","g":"הקהילה שהכל כאן !!!","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/hkhylh-shhkl-kan-p4i9vb/#m-A5E710AFAC44ECFEA455ADC9B58CFD0F","d":"2026-09-23","t":"10:08","s":"אין עוד מלבדו !!...","x":"🛑מעלת הישיבה בסוכה.\n🪄מדברי קודשו של הרה\"ג שלמה אסולין זצ\"ל. \n\n🪷כל רגע בישיבת הסוכה, מ\"ע בפנ\"ע !!!!!!\r\nהגמ' בסוף מסכת סוכה מביאה על ירידת גשמים בזמן \r\nסוכות, משל לעבד שבא למזוג כוס לרבו, ושפך לו רבו \r\nקיתון על פניו'.\r\nלכאורה ע\"פ המשל שייך הנמשל, שרק אם רצה להיכנס לסוכה, ומיד ברגע זה ירדו גשמים, שעל זה שייך 'שבא למזוג כוס לרבו'. אבל אם כבר ישב בסוכה \r\nוירדו גשמים, נמצא שכבר מזוג כוס לרבו, רק שבאמצע שפך לו על פניו, א\"כ אין המשל מדוייק כ\"כ \r\nדנקט 'שבא למזוג'.\r\nונראה מזה שכל רגע הוא מצוות עשה של ישיבה \r\nבסוכה. ולכן כלפי הכוס שבא למזוג עתה, דהיינו כלפי \r\nהרגע שרוצה עוד להישאר בסוכה, נחשב למזיגת כוס \r\nחדשה, ועל זה שייך ש'בא למזוג כוס ושפך לו רבו' וכו'. \r\nועיין לאבודרהם שהובא ביסוד ושורש העבודה שג\"כ \r\nכתב שכל רגע איכא מ\"ע בפני עצמה.\r\n(כת\"י). \r\nחג שמח🌷","a":[],"f":[{"n":"תמונה.jpg","y":"image/jpeg","p":"https://drive.google.com/file/d/1icYKjgtKdXrhVO-bO4So5rCocCOPsrTY/view?usp=drivesdk","h":"https://drive.google.com/thumbnail?id=1icYKjgtKdXrhVO-bO4So5rCocCOPsrTY&sz=w1200","k":""}]},{"c":"torah","g":"דרישת ציון, הצעה לתיקון לחטא המרגלים","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/drysht-tzyvn-htzah-ltykvn-lchta-hmrglym-i4si8s/#m-AC0487D486FA7849CDFE654E3F6710B2","d":"2026-09-23","t":"15:02","s":"קרן מגן","x":"*מעלת לקיחת אתרוגי ארץ ישראל* \n\n *הרמב\"ם במורה הנבוכים* , (חלק שלישי, פרק מג) כותב שהטעם שהתורה ציוותה דווקא ארבעת מינים אלו כדי לעשות זיכרון ליציאה מהמדבר השמם לארץ ישראל. ודווקא מינים אלו נבחרו לזיכרון הוא *מפני שהם היו מצויים בארץ ומסמלים את המובחר* שבפירות (לולב), בריח (אתרוג), בעלים (הדס) ובעשבים (ערבה), וזה לשונו:\n\n\"ואלו הארבעה מינין הם אשר קיבצו שלושת הדברים האלה: האחד מהם – *רוב מציאותם בארץ ישראל* בעת ההיא והיה כל אדם יכול למצאם\".\n\nבמשך השנים התעוררו דיונים הלכתיים על זנים שונים של אתרוגים מכל מיני מקומות בעולם. אמנם מהפוסקים נראה *שהעדיפו אתרוגים מארץ ישראל ולא מחו''ל* אפילו אם הם פחות מהודרים.\n\nאחת ההתבטאויות החריפות כנגד אתרוגי חו\"ל מובאת בספר *שדי חמד* (ח\"ד מערכת למ\"ד) שהביא דברים שכתב *בעל 'ערוך השולחן',* וזה לשונו:\n\nומצאתי אצלי העתק מכתב ידידי הגאון אבד\"ק נאוורדאק מחבר ספרים היקרים 'ערוך השולחן'... וז\"ל: והנה בעיקר הענין *אותם המבכרים פרי בן השנואה על אתרוגי בן האהובה,* קצר עטי אשר אתי לתאר *שפלות נפשם ופחיתות דרכם, ורוע לבבם והסרת מסוה הבושה* מעל פניהם הדומים לפני הדור בעקבא דמשיחא. \nמה נאמר ומה נדבר, האלהים מצא את עוונינו להיות ללעג ולקלס בפני עצמנו ובפני אחרים. מי ראה כזאת ומי שמע כאלה... *הנכון לאיש הישראלי לבלי לבכר פרי ארצנו הקדושה על פרי ארץ העמים?!* איה כבודו יתברך, איה כבוד התורה הקדושה שבפסוקים רבים השתבחה בשבחה של ארץ ישראל?\n *איה כבוד משה רבינו* שהתחנן אעברה נא ואראה הארץ הטובה?!... ואלו האנשים מגנדרים בעפרא דארץ אחרת *ומנשקים פירותיהם וישליכו פריה וטובה של ארץ הקדושה* ככלי אין חפץ בו\".\n\nבספר ערוך השולחן (לרב יחיאל מיכל אפשטיין או\"ח תרמח, כט) מתייחס בתחילה לפסול 'מורכב' ובהמשך דוחה את האפשרות שלא לקנות מאתרוגי ארץ ישראל:\n\n\"ולכן כל איש מישראל אשר נגע יראת ה' בליבו לא ייקח רק אתרוגי ארץ ישראל. *ואיך לא נבוש ולא ניכלם בדבר מצוה שנוכל לקיימה מפרי ארצנו הקדושה ליטול דווקא מארץ העמים?* אוי לה לאותה בושה, אוי לה לאותה כלימה, ועל זה נאמר \"וימאסו בארץ חמדה\". ולכן יש להיזהר בזה מאוד מאוד\".\n\nגם *הרב עובדיה הדאיה* (שו\"ת ישכיל עבדי חלק ו' סימן כא) כתב על עדיפות אתרוגי ארץ ישראל על פני אתרוגי חו\"ל, בשל קדושת ארץ ישראל שבהם:\n\n''ברור שפירות ארץ ישראל הם יש להם עדיפות מצד קדושתן, *שהם גדלו בקדושה ובטהרה,* שהרי אוויר ארץ העמים ועפרו טמא, כידוע, ואם כן כשגדל הפרי בעפר ואוויר ארץ העמים הרי גדל בטומאה. לא כן אוויר ארץ ישראל ועפרה הוא טהור וקדוש... *ואם עפר הדומם חביב כל כך,* מכל שכן המעולה מהדומם (=הצומח), שוודאי עלינו לחבבו משאר צומח שבחו\"ל הגדל בטומאת ארץ העמים, ודבר זה פשוט וברור לכל\".\n\nאליעזר מגן\nרב בית הכנסת 'היכל משה' ר\"ג","a":[],"f":[]},{"c":"torah","g":"רבני בי\"ס","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/rabanim-yesodi-y54iyx/#m-3EB0E078A431E38CAEDCAC","d":"2026-09-23","t":"20:15","s":"אהרן קדוש","x":"ב\"ה\n\n*לראות את הכוכבים*\n\nבכל שנה, כשאנו עוזבים את הבית הבטוח, בעל הקירות המוצקים והגג האיתן, ועוברים להתגורר בדירת עראי שתחת כיפת השמיים, עולה השאלה הטבעית: מהו סוד החוסן האמיתי שלנו?\n\nההלכה מלמדת אותנו שסוכה שצילתה מרובה מחמתה כשרה, אך בד בבד עליה להיות \"פרוסה\" כך שייראו מתוכה הכוכבים. אם נניח סכך כה עבה ואטום עד שאף קרן אור אינה נראית,  יצאנו מגדרי דירת עראי ופגמנו במהות המצווה. יש צורך בקביעות של דפנות ובצל של הסכך, אך חובה להשאיר פתח, חרך שדרכו ניתן להביט למעלה.\n\nמסופר על הרה\"ק רבי לוי יצחק מברדיטשוב זי\"ע, סנגורם של ישראל, שסייר בעיירתו בערב חג הסוכות. בדרכו ראה את אחד מבעלי המלאכה הפשוטים טורח ומקים את סוכתו. האיש עמל שעות ארוכות, אך בשל עוניו לא היו לו מספיק קרשים ישרים, והדפנות נראו עקומות ומלאות סדקים. עמד אותו יהודי, הביט ביציר כפיו בלב נשבר, ונאנח מעומק לבו: \"ריבונו של עולם, כל כך רציתי לבנות לך סוכה נאה, חזקה וישרה, ומה יצא תחת ידי? סוכה פשוטה ורעועה, מלאה פגמים ורווחים\".\n\nניגש אליו רבי לוי יצחק, הניח יד חמה על כתפו ואמר לו: \"דע לך, אהובי, שדווקא דרך הסדקים והרווחים שבסוכתך מאיר האור הגדול ביותר. מי שסוכתו מושלמת ואטומה מכל עבר, עלול לשכוח לרגע קט מי באמת שומר עליו ומחזיק את קירותיו. אבל מי שיודע שמשכנו שברירי ופתוח לשמיים, מכיר בכך שהוא חוסה אך ורק ב'צלא דמהימנותא' – בצל כנפיו של הבורא\".\n\nהמפגש בין הסכך לכוכבים ובין הסדקים לאור טומן בחובו יסוד חינוכי ראשון במעלה, עבורנו הן כהורים והן כמחנכים.\n\nלעיתים קרובות אנו שואפים להעניק לילדינו מעטפת הרמטית ומושלמת: חומות של הגנה, ביטחון מלא ופתרונות לכל אתגר עוד בטרם צץ. אנו רוצים \"לבנות להם בית\" שאין בו אף רוח מצויה או סדק של חוסר ודאות. אולם, החיים מלמדים אותנו שהחוסן האמיתי של הילד אינו נבנה מאטימות ומבידוד, אלא דווקא מן היכולת לזהות את הכוכבים דרך הפערים והקשיים.\n\nחינוך אמיתי דורש דפנות יציבות, גבולות ברורים, סדר יום, חום ויציבות רגשית. אך הוא דורש גם \"סכך\" שאינו חונק, כזה המשאיר מרחב לנשימה, לבחירה, לצמיחה אישית ולפיתוח כושר התמודדות. כאשר ילד פוגש קושי או תסכול, תפקידנו אינו בהכרח לאטום את הסדק מיד במקומו, אלא ללמד אותו להביט דרכו כלפי מעלה – להקנות לו אמונה בעצמו, ביטחון בה' ותחושה שהוא לעולם אינו לבד.\n\nבימי חג האסיף, שבהם אנו מודים על יבול השדה, נזכור שההישגים הגדולים ביותר אינם נמדדים בחוזק החומות החיצוניות, אלא בעומק הביטחון הפנימי. כשנשב יחד בסוכה, לצד בני המשפחה והאושפיזין, נתבונן מבעד לסכך ונברך על הרווחים המאפשרים לאור הכוכבים לחדור אל תוך עולמנו, ומתוך כך נזכה לשבת כולנו יחדיו תחת סוכת שלומו הפרוסה עלינו.\n\nאהרן קדוש","a":[],"f":[]},{"c":"torah","g":"רבני בי\"ס","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/rabanim-yesodi-y54iyx/#m-3EB0A4679FB1E81D7E375E","d":"2026-09-24","t":"10:00","s":"אהרן קדוש","x":"","a":[],"f":[{"n":"סֻכַּת שָׁלוֹם - רעיון לחג הסוכות - תשפו.pdf","y":"application/pdf","p":"https://drive.google.com/file/d/1mhdEYgcbgPq0YhnPD-nBEFg3fcxZtvrS/view?usp=drivesdk","h":"","k":""}]},{"c":"torah","g":"רבני בי\"ס","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/rabanim-yesodi-y54iyx/#m-3EB083F73DB8E945968134","d":"2026-09-24","t":"10:00","s":"אהרן קדוש","x":"","a":[],"f":[{"n":"רַק אוֹרֵחַ- רעיון לחג הסוכות.pdf","y":"application/pdf","p":"https://drive.google.com/file/d/1zQg30-p2n_LV2QXycrzZQrK0f6nGvx7m/view?usp=drivesdk","h":"","k":""}]},{"c":"torah","g":"'חלקנו' - עדכונים ותוכן 23","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/chlknv-adkvnym-vtvkn-23-ysve6w/#m-A5D3A6AC3F1F854F242FCA1CA4710D03","d":"2026-09-24","t":"12:45","s":"מחלקת התוכן חלקי בקהילתי","x":"*סוכת חיים*\n\nהשבוע בעלון חלקנו 332 - מבית חלקי בקהילתי - לחג הסוכות, יוצאים מדירת הקבע הבנויה לתלפיות, למסע בעיר הפלאות, המחבקת ומספקת תשובות.\n\n  \n🖋️ *עיר מקלט* הרב ברוך צבי גרינבוים שליט\"א מגדיר את הסוכה, כמקלט של בהירות, ואת ימי הישיבה בה כתקופה המקנה תובנות חדשות לחיים חדשים.\n \n🖋️ *תכשיט וקישוט* הרב יוסף איצקוביץ משתף הרהורים לחג הסוכות, המקשטים ומוסיפים נוי וקסם לשבעת הימים המופלאים העומדים בפנינו. \n \n\n🖋️ *חלומו של הרקאנטי* גונן זיק, מנתח שתי גישות של חכמי הקבלה בהבנת ספירת המלכות, והשלכה הלכתית מפתיעה על צורת נטילת ארבעת המינים.\n\n  \n🖊️*וגם...*\nשמואל אלחרר חזר משוק ארבעת המינים, הלום פאשקוולים ורמקולים, עם תובנות מפתיעות\nישי גוזלן על תעמולת האחדות, ודבק המודעות \nויגאל מאור, מסיק מסקנות חינוכיות מהמסע לקניית האתרוג...\n \n*לקבלת תכנים נוספים, כנסו לקישור* 🔗\n\nhttps://api.whatsapp.com/send?phone=97226260115&text=הי","a":[],"f":[{"n":"חלקנו 332 - חג הסוכות.pdf","y":"application/pdf","p":"https://drive.google.com/file/d/1mMm_q-jKGYe2xiy3y7Ir3cdYtTxoS5ok/view?usp=drivesdk","h":"","k":""}]},{"c":"torah","g":"🕎בית מדרש קהילתי ק.אתא✡️","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/byt-mdrsh-khylty-k-ata-v7gamj/#m-AC01A20F7E4BAB15D0A31EAEE01B9A5B","d":"2026-09-24","t":"20:15","s":"מי שמאמין לא מפחד","x":"🌹חג סוכות🌹\n\nכשמתבוננים בשבעת האושפיזין שמגיעים אלינו בחג הסוכות מבחינים שרק יום פטירתו של אהרון הכהן מוזכר במפורש בתורה בפרשת \"מסעי\", ואילו שאר ימי פטירת הצדיקים קיבלנו במסורת מאבותנו.                                                   \n\nהדבר מאד מפליא שבכל התורה כולה לא מצוין יום פטירתם של אף דמות - לא האבות, לא משה, לא מרים, אף אחד מגדולי אבותינו לא פורסם יום פטירתו..\n\nמה זכה אהרון שצוין יום פטירתו בתורה - א' אב?\n\nכתוב על אהרון: \"אוהב שלום ורודף שלום, אוהב את הבריות..\" (אבות,א',יב')\nלא כתוב שרק היה אוהב את השלום אלא ממש היה רודף אחריו, רץ כדי לעשות שלום - בין איש לרעהו, בין איש לאשתו..\n\nגדול השלום שאפילו שמו של הקב\"ה נקרא שלום, ומי ששמו שלום אוהב בריות שעושים שלום בין אנשים.\n\nאהרון שיצר ועשה שלום בין בניו של הקב\"ה זכה לאהבה אמיתית לא רק מהסביבה שלידו אלא לאהבה מבורא עולם, שהנציח את יום פטירתו בספר הספרים כדי שכולם יציינו את היום הזה לכבודו.\n\nמעלת השלום גדולה היא, אין אדם שלא רוצה לחיות בשלום עם סביבתו.\nאך בשביל השלום צריך לעמול - למחול, לוותר, להעביר ולא להקפיד!\n\nאם אתה באמת רוצה להיות אהוב למעלה, תדאג שתהיה גם אהוב למטה - תהיה בשלום עם חבריך, פחות תקפיד, יותר תוותר.\n\nהסוכה שאנו דרים בה שבעה ימים נקראת סוכת שלום, שלום מלשון שלם.\nרק על-ידי השלום עם כל סביבתך אתה יכול להיות באמת אדם שלם.            \n                                  \nאם בחג הזה נרבה באחדות - כמו בארבעת המינים, נכניס אורחים לסוכתנו, נעשה אותה באמת סוכת שלום, נזכה לשלום אמיתי עם בורא עולם, נזכה לשלמות אמיתית לשנה טובה ושלווה.              \n \nבתפילה לשלומם של חיילינו  ולהחלמה לכל הפצועים והחולים\nמועדים לשמחה שבת שלום ומבורך ובשורות טובות\nחתימה טובה💐🌹","a":[],"f":[]},{"c":"torah","g":"רבני בי\"ס","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/rabanim-yesodi-y54iyx/#m-3EB0851D1B6C939DD7572F","d":"2026-09-24","t":"21:11","s":"אהרן קדוש","x":"","a":[],"f":[{"n":"ושמחת בחגך- פנינים ורעיונות לחג הסוכות+שמחת תורה- מחולק לפי ימים.pdf","y":"application/pdf","p":"https://drive.google.com/file/d/1bUlCClFmweC57iEfFP6WYAE79i6loQcx/view?usp=drivesdk","h":"","k":""}]},{"c":"teach","g":"משפחת נעם","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/noam-uc5qz3/#m-gm-1a0776e740770def","d":"2026-09-06","t":"18:55","s":"יהודה טאוב דירות אירוח בקרי אתא","x":"","a":[],"f":[{"n":"סוכה לדוגמא.pdf","y":"application/pdf","p":"https://drive.google.com/file/d/1NMssr74d6DUQbUJSysxw3Uu0s3WsB3dO/view?usp=drivesdk","h":"","k":""}]},{"c":"teach","g":"בראשית 2 לך לך","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/bereshit-tbsjrb/#m-gm-1a078370704a0f00","d":"2026-09-06","t":"22:34","s":"מעיין גרינשפן","x":"מלמדת מחר על קדושת התורה.. אולי יעזור למישו..","a":[],"f":[{"n":"אושפיזין_20260906_221353_0000.pdf","y":"application/pdf","p":"https://drive.google.com/file/d/1J7WUSPviNKPn5IvGgQUiQlinTU5g3zJN/view?usp=drivesdk","h":"","k":""}]},{"c":"teach","g":"רבני בי\"ס","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/rabanim-yesodi-y54iyx/#m-gm-1a07f3aedb0f5889","d":"2026-09-08","t":"07:15","s":"אהרן קדוש","x":"","a":[],"f":[{"n":"ארבעת המינים.pdf","y":"application/pdf","p":"https://drive.google.com/file/d/1DvR_kNLkAaektEtsLQBQQJoXGPGX2aXF/view?usp=drivesdk","h":"","k":""}]},{"c":"teach","g":"רבני בי\"ס","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/rabanim-yesodi-y54iyx/#m-gm-1a07f8de3d39dad0","d":"2026-09-08","t":"08:46","s":"עמיחי","x":"*שלום וברכה לכולם😃!*\nבס\"ד לזיכוי הרבים, משתף ב\"לימוד יומי\" לסוכות🌿🌿 *\"בצלו חמדתי וישבתי\" - הרב חנן פורת זצ\"ל* (דמות החמ\"ד)\n\nהקובץ מורכב מ:\n📌 *לימוד על האושפיזין* של אותו יום📗\n📌 *סיפורים והנהגות* על הרב חנן פורת זצ\"ל📚\n📌 *\"המשפט היומי\"* - הרב חנן פורת זצ\"ל📖\n📌 *\"ושמחת בחגך\"* סריקת QR code -   שירים לכבוד המועד.🎼\n📌ו... *הפתעה*🎁 ערכת קישוט לסוכה.\n\n💥מוזמנים להדפיס כחוברת לבית ספריכם. *אשמח לשיתוף תמונה/סרטון מיום החלוקה בבית הספר (בצירוף שם בית הספר + העיר)*.\n\n*שנה טובה ומתוקה וגמר חתימה טובה!*\nבברכה,\nעמיחי נחשוני","a":[],"f":[]},{"c":"teach","g":"הלכה כתה ד'","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/halacha-d-getdaq/#m-gm-1a07ff5bedd235b8","d":"2026-09-08","t":"10:40","s":"אתי","x":"שלום וברכה,\nלאחר השקעה רבה\nשמחים להציג את כל השיעורים *לחגי תשרי*\n\n📒 *ראש השנה*\nhttps://abita.co.il/lesson_category/ראש-השנה/\n\n📕 *צום גדליה*\nhttps://abita.co.il/lessons/צום-גדליה/\n\n📘 *יום הכיפורים*\nhttps://abita.co.il/lesson_category/יום-הכיפורים/\n\n📗 *סוכות ושמחת תורה*\nhttps://abita.co.il/lesson_category/סוכות/\n\n📣 *להצטרפות לקבוצה חגים - ממלכתי*\n\n📣 *להצטרפות לקבוצה חגים - ממ״ד*","a":[],"f":[{"n":"תמונה.jpg","y":"image/jpeg","p":"https://drive.google.com/file/d/14pER97A-FtPR2-1sPgXJrkBhZMgDlRYF/view?usp=drivesdk","h":"https://drive.google.com/thumbnail?id=14pER97A-FtPR2-1sPgXJrkBhZMgDlRYF&sz=w1200","k":""}]},{"c":"teach","g":"דברים 2 שמואל ב","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/devarim-fqfusf/#m-gm-1a087bdd756102b1","d":"2026-09-09","t":"22:55","s":"הדס דילר 🇮🇱","x":"אני תמיד מקרינה את העמוד מהחומש של הקורבנות  של חג סוכות. \nשמשם הן רואות כמה מקריבים כל יום  את המצוה יותר עם אהבה, יותר עם שמה, יותר עם רצון","a":[],"f":[]},{"c":"stories","g":"חנן פורת - דמות","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/chanan-porat-4uykpp-kyeukx/#m-gm-1a0b0f13e1aa0ee6","d":"2026-09-17","t":"22:56","s":"עמירם אלבה","x":"וזה מה שפורסם כאן עם הסיפור על האהבה למצות סוכה גם כאשר יורד גשם. אני מקיים את המצוה כי אני רוצה ולא רק כאשר אני חייב","a":[],"f":[]},{"c":"stories","g":"רבני בי\"ס","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/rabanim-yesodi-y54iyx/#m-3EB02D19AEF2AB0FABD700","d":"2026-09-22","t":"14:15","s":"אהרן קדוש","x":"","a":[],"f":[{"n":"אוֹרֵחַ בַּסֻּכָּה  - סיפור לשבת -סוכות.pdf","y":"application/pdf","p":"https://drive.google.com/file/d/1AO8VcB6S4ZCo46lk0nrGvVmOixEKp9dV/view?usp=drivesdk","h":"","k":""}]},{"c":"stories","g":"רבני בי\"ס","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/rabanim-yesodi-y54iyx/#m-ACBAB3F8B421277C9FAB9BCAA12565D7","d":"2026-09-22","t":"14:25","s":"אשר","x":"*בסוכה אחת* 🌿\n✨ סיפור ולימוד מיוחד מאוד לימי הסוכות!\n😊*הקובץ כאן מצורף בחינם* ⬆️\nמוזמנים לשתף הלאה 🙏\n(אם תרצו עם לוגו של המוסד שלכם כיתבו לי)\n*חג שמח לכל ישראל* 🇮🇱","a":[],"f":[{"n":"בסוכה אחת תשפז-1.pdf","y":"application/pdf","p":"https://drive.google.com/file/d/1iI_HPtPHn9wNFGOvudSxMKRRtu8WoAQ_/view?usp=drivesdk","h":"","k":""}]},{"c":"stories","g":"רבני בי\"ס","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/rabanim-yesodi-y54iyx/#m-3EB0D055DE640C5BCD491E","d":"2026-09-22","t":"18:56","s":"אהרן קדוש","x":"ב\"ה\n\n*קרב האתרוגים*\n\nבחג הסוכות בבית המקדש בירושלים. הייתה שמחה גדולה. יש שירים, כינורות, חלילים, אלפי אנשים רוקדים ושמחים ב\"שמחת בית השואבה\". כולם מחכים לרגע הכי מרגש של היום:  *'ניסוך המים'*.\n\nבכל השנה שופכים על גבי המזבח יין, אבל בסוכות קורה משהו מיוחד – שופכים גם מים צלולים ורעננים ממעיין הגיחון, סגולה לשנה מבורכת בגשמים.\n\nכולם עומדים בשקט מוחלט וברטט של קדושה. הכהן עולה לאט לאט במעלות הכבש של המזבח, אוחז בצלוחית הזהב המלאה מים... כולם מסתכלים למעלה, מחכים לראות את המים נשפכים לספל המיוחד שעל המזבח.\nופתאום – הלם!\n\nהכהן הזה, שהיה שייך לקבוצה שנקראה \"צדוקים\" (אנשים שלא האמינו בדברי חכמים ובתושב\"ע), מחליט לעשות דווקא. במקום לשפוך את המים על המזבח כמצוות התורה, הוא שופך אותם בזלזול... על הרגליים של עצמו!\n\nהגמרא במסכת סוכה מספרת מה קרה באותו שבריר שנייה: כל הקהל הגדול ראה את זה, ומרוב כעס על הפגיעה בכבוד השם – *רגמו אותו באתרוגיהם!*\n\nויש להבין: אם הקהל כל כך כעס ורצה למחות, מדוע הם זרקו עליו דווקא אתרוגים? הרי בחצר בית המקדש מן הסתם אפשר היה למצוא אבנים או חפצים אחרים. ובכלל, האתרוג הוא פרי יקר, מהודר, ששילמו עליו המון כסף ושמרו עליו בקופסה מרופדת בצמר גפן – לא חבל להרוס אותו ולזרוק אותו?\n\nאלא שכאן טמון אחד המסרים הכי יפים וחשובים לחיים שלנו!\n\nהעם בבית המקדש לימד אותנו כלל ברזל לדורות :כשמישהו בא לפגוע בתורה, כשמישהו מנסה להעליב, לזלזל בקדושה, או לצער אותנו - *אנחנו לא נלחמים באבנים.*\n\nאבן היא דבר קר, קשה, שפוצע והורס. אבנים מייצגות כעס, אלימות ומריבות. התשובה של עם ישראל למי שמנסה להחליש את התורה היא לעולם לא באבנים  אלא *באתרוגים!*\n\nהאתרוג הוא הפרי הכי מיוחד מבין ארבעת המינים: יש לו גם טעם וגם ריח, והוא מסמל יהודי שיש בו גם לימוד תורה וגם מעשים טובים ומידות יפות.\n\n*לזרוק \"אתרוגים\"* פירושו:\n\n• כשמישהו מנסה לכבות את האור – אנחנו לא צועקים בחושך, אנחנו *מדליקים עוד אור!*\n\n• כשמישהו מנסה לזלזל במצוות – אנחנו עושים את המצוות בעוד יותר הידור ושמחה.\n\n• כשמישהו מדבר לא יפה – *אנחנו עונים בשיא הנימוס*, החיוך והאהבה.\n\n•אם מישהו מנסה לעצור לימוד תורה – *מקימים עוד שיעור*, לומדים עוד משנה, *ופותחים עוד מקום של תפילה וחסד*.\n\nלפעמים כשמישהו מעצבן אותנו ופוגע בנו האינסטינקט הראשון שלנו הוא \"לזרוק אבן\" – להחזיר לו, לצעוק, להעליב בחזרה.\nאבל חג סוכות מלמד אותנו להיות אנשים של \"אתרוגים\": לנצח את הרע על ידי עוד יותר טוב. להרבות באהבת ישראל, להוסיף שמחה, ולהראות לכולם כמה התורה שלנו מתוקה ומאירה.\n\nכשנחזיק את האתרוג בחג הסוכות נסתכל עליו, ונזכור: כשאנחנו מוסיפים עוד מעשה טוב, עוד חיוך ועוד מצווה – זה הניצחון הכי גדול והקידוש השם הכי יפה שיכול להיות בעולם!\n\nאהרן קדוש","a":[],"f":[]},{"c":"halacha","g":"🕎בית מדרש קהילתי ק.אתא✡️","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/byt-mdrsh-khylty-k-ata-v7gamj/#m-AC8C5C78FB500DEECC2AEBD49EEED7AB","d":"2026-09-22","t":"08:21","s":"מי שמאמין לא מפחד","x":"🤔 *היכן צריך לבנות את הסוכה?*\nבונים את הסוכה תחת כיפת השמיים, ואם בנה תחת גג המרפסת וכד' – הסוכה פסולה, וכן יש להיזהר שלא לבנות את הסוכה מתחת לאילן המחובר לקרקע, ובפרט יש להזהיר את בעלי המסעדות הבונים סוכה ברחוב, שלעיתים סוכתם תחת אילן מחמת חוסר מקום, וסוכתם פסולה.\nאין לבנות את הסוכה במקום שיש שם ריח לא טוב, כגון בסמוך לפחי אשפה שברחוב, שמא לא יוכל לשבת בה, ויצא מן הסוכה.\n\n💫 *האם מותר להניח סדינים כדופן לסוכה?*\nדופן הסוכה צריכה להיות ראויה לעמוד בפני רוח מצויה, ואם הדופן נדה ברוח אף נדנוד קל, אינה נחשבת כמחיצה, והיא פסולה לשמש דופן לסוכה. על כן סדינים המונחים כדופן לסוכה הממוקמת בחוץ, במקום שיש רוח, הרי סוכה זו פסולה, מכיוון שהסדינים נעים ברוח, והאוכל בסוכה זו מברך ברכות לבטלה, ונחשב כאוכל מחוץ לסוכה. על כן יש ליידע את המסעדות שבונות סוכה סמוך לחנות כשהדפנות עשויות מסדינים, ומכשילים את הציבור בברכה לבטלה ובאכילה מחוץ לסוכה.\nאולם אם עושה סוכה כזו בתוך חצר המוקפת חומה שאין בה רוח, ומקפיד לקשור את הסדינים היטב באופן שלא ינודו אף אם תימצא שם רוח מצויה, אין לחשוש שמא תינתק הקשירה, הרי שבפועל אין רוח, והסוכה כשרה.\n\n*2 הלכות ביום מתוך \"בהלכה ובאגדה\", עפ\"י פסקי מרן הרב עובדיה יוסף זצ\"ל.*\nיום שלישי, י\"א בתשרי \n*אנא הפיצו לחברים. מי שקיבל מחבר/ה מוזמן להצטרף בלינק did.li/2beyom*\n\n📖 *לשאלות בהלכה - שלחו הודעה:*\nלחצו Wa.me/972529551624\n\n🙏 *לליווי אישי בכל עניין רוחני* \nיש עם מי לדבר - did.li/ledaber\n\n🤷‍♂️ *איך בוחרים אתרוג כשר? הרב אברהם יוסף מסביר ומדגים. צפו*\nhttps://www.hidabroot.org/article/1130852\n\nרוצים לקבל סרטונים ועדכונים מהידברות? *הצטרפו להידברות ב-WhatsApp* בהתאמה אישית 🪀\nלחצו hidabroot.my.canva.site/","a":[],"f":[]},{"c":"halacha","g":"'חלקנו' - עדכונים ותוכן 23","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/chlknv-adkvnym-vtvkn-23-ysve6w/#m-A5860345AE9172D606B3643104F0BF67","d":"2026-09-22","t":"08:34","s":"מחלקת התוכן חלקי בקהילתי","x":"🍋🍋 *קניתם אתרוג יפהפה* *אבל יש עליו כתמים חומים כאלו* ...\n\n🤔 *האם הם פוסלים אותו?* \n*האם הוא מהודר לגמרי?* \n\nהרב אהרון דואר שליט״א - מרבני חלקי בקהילתי עושה לנו סדר .\n\n *להצטרפות לקבוצת העדכונים של חלקי בקהילתי*>>>","a":[],"f":[{"n":"וידאו.mp4","y":"video/mp4","p":"","h":"","k":"12.5MB — מעל התקרה לקבוצות ארכיון"}]},{"c":"halacha","g":"רבני בי\"ס","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/rabanim-yesodi-y54iyx/#m-3EB01786B92DE01EDB4C74","d":"2026-09-22","t":"14:44","s":"Nativ Barichi","x":"","a":[],"f":[{"n":"דיני סוכה .pdf","y":"application/pdf","p":"","h":"","k":"7.0MB — מעל התקרה לקבוצות ארכיון"}]},{"c":"halacha","g":"רבני בי\"ס","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/rabanim-yesodi-y54iyx/#m-3EB0054E1F0B5D383BBA9D","d":"2026-09-23","t":"16:19","s":"יהודה טאוב דירות אירוח בקרי אתא","x":"","a":[],"f":[{"n":"דיני ארבעת המינים  - בצורה משעשעת (1).pdf","y":"application/pdf","p":"https://drive.google.com/file/d/1WY4aFDzu_8lnr2tfuhhPgHfsGu_toHwk/view?usp=drivesdk","h":"","k":""}]},{"c":"halacha","g":"בית הוראה מבקשי תורה","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/byt-hvrah-mbkshy-tvrh-fmdq5y/#m-2AABEE241A27FCD96319","d":"2026-09-24","t":"08:55","s":"בית הוראה מבקשי תורה","x":"יום חמישי י״ג תשרי תשפ״ז\n\n*שאלה:*\n\nסכך שנפל מהסוכה בשבת, האם מותר לומר לגוי שיניח אותו על הסוכה?\n\n*תשובה:*\n\nאסור לומר לגוי בשבת להניח סכך על הסוכה, ואין חילוק בין אמירה גמורה לאמירה ע\"י רמז.\n\n*ביאור הדין:*\n\n*השלחן ערוך פסק* (סי' שטו סע' א), אסור לעשות אהל בשבת ויום טוב אפילו הוא עראי, אמנם יש חילוק בין אהל עראי לאהל קבע, שעשיית אהל קבוע איסורה מן התורה, ואהל עראי איסורו מדרבנן. וההבדל בין אהל עראי לאהל קבע, שאהל עראי היינו שעושה אותו לזמן מועט, ואהל קבע שעושה אותו לזמן גדול.\n\n*וכתב בשער הציון* (שם ס\"ק ו) שעשיית אהל לכמה ימים נחשב אהל קבע, ולפי זה נתינת סכך על גבי סוכה אסורה מדאורייתא כיון שמניחו לכמה ימים והוי אהל קבע, ומטעם זה אסור בשבת לומר לגוי ליתן סכך על גבי הסוכה, אע\"פ שעושה כן לצורך מצוה, שאסור לומר לגוי לעשות איסור דאורייתא לצורך מצוה כמבואר בשלחן ערוך (סי' שז סע' ה).\n\n*אמנם כאשר נפל הסכך ביום טוב שלא חל בשבת,* כתב המשנ\"ב (סי' תרלז ס\"ק א בשם הבאר יצחק (או\"ח סי' יג) שמותר לומר לגוי להניחו על הסוכה. ובטעם הדבר כתב הבאר יצחק, מכיון ששיטת התוס' (שבת צה, א) שאיסור בונה ביו\"ט אינו מן התורה אלא מדרבנן. ולפי זה הוי שבות דשבות במקום מצוה. ואע\"פ ששיטת הרמב\"ם שאיסור בונה ביום טוב הוא מדאורייתא, מ\"מ יש לצרף את דעת בעל העיטור שמותר לומר לגוי לעשות מלאכה דאורייתא במקום מצוה, כמבואר ברמ\"א (סי' רעו סע' ב).\n\n*אמנם עדיף לרמז לגוי להניח הסכך,* או שיאמר לגוי לומר לגוי אחר להניח הסכך, כיון שיש חולקים על עיקר היתרו של הבאר יצחק.\n\n*ובאמת המשנ\"ב לכאורה סותר את עצמו,* שכתב (סי' תרכו ס\"ק כ) וז\"ל, אם מותר לומר לנכרי שיסכך לו סוכה ביום טוב באין לו אחרת מסתפק הפמ\"ג, וסיים להורות היתר חלילה לי וצ\"ע בכל זה, ואם הוא עדיין בין השמשות נראה דבודאי יש להקל בזה ע\"י עכו\"ם.\n\n*וכתב החוט שני* (סוכות עמ' קצז) שמה שהמשנ\"ב הביא לאסור בשם הפמ\"ג מדובר שהוא פשע בבנייתו לכן אסור ע\"י נכרי, אבל אם נאנס בבנייתו או שנפל הסכך בשבת מותר להחזירו ע\"י נכרי.\n\n*אבל בשו\"ת רבבות אפרים* (ח\"א סי' תכד) הביא בשם הגר\"ח קנייבסקי זצ\"ל שהלכה כמשנ\"ב סי' תרלז כיון שהוא בתרא.\n\n*וכן פסק הגרי\"ש אלישיב זצ\"ל* (אשרי האיש ח\"ג פכ\"ה סע' לא), שאם נפל הסכך ביום טוב מותר לומר לנכרי להחזירו.\n\n*קישור ישיר לשליחת שאלה לבית ההוראה* https://wa.me/972584433613\n\n*יום טוב!*","a":[],"f":[]},{"c":"qa","g":"שערי הלכה ומשפט - כללי 3","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/shary-hlkh-vmshpt-klly-3-jtmqxt/#m-AC1B3BBBA956CEA6A9B93EFD0FA1B0DC","d":"2026-09-22","t":"07:27","s":"עדי סוסן","x":"בוקר טוב האם בסוכה מותר לישון מתחת שולחן?","a":[],"f":[]},{"c":"qa","g":"שערי הלכה ומשפט - כללי 3","u":"https://yudataub.github.io/wa-archive-wfn4fgem/g/shary-hlkh-vmshpt-klly-3-jtmqxt/#m-3AF5C1D477BDF1D37BA6","d":"2026-09-22","t":"14:12","s":":-)","x":"היה ויכוח בין 2 אברכים , אשמח לדעת מי צודק,\n\nהמקרה-\nהתחילו לבנות סוכה אתמול לאחר צאת כיפור, הסוכה כ5 על 5 מטר \nבפועל עשו רק את הסמוכות 2 על 2 על 2 ( שזו סוכה כשרה) אבל לא המשיכו את שאר הדפנות עדיין.\n\nאחד אמר אפשר
